name: Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  push:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    env:
      # Keep the bundle out of the system gems. release-gem signs the gem
      # with an unbundled `gem exec` that sees the system gems, and the json
      # version in Gemfile.lock can break the signer there.
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # zizmor complains that 'v1' is a ref that can be provided by both the branch and tag namespaces.
      # specify that we want the v1 branch.
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ruby

      - run: bundle install
        env:
          BUNDLE_FROZEN: true

      # zizmor complains that 'v1' is a ref that can be provided by both the branch and tag namespaces.
      # specify that we want the v1 branch.
      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2

      # release-gem pushes the gem without an attestation if signing fails,
      # and the job still passes. Fail the job so that someone notices.
      - name: Check that RubyGems.org has an attestation
        run: |
          for gem in pkg/*.gem; do
            name="$(basename "$gem" .gem)"
            if ! curl -fsS "https://rubygems.org/api/v1/attestations/$name.json" |
              jq -e 'length > 0' >/dev/null; then
              echo "::error::RubyGems.org has no attestation for $name."
              exit 1
            fi
          done
